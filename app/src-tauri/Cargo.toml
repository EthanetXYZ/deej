[package]
name = "deej-next"
description = "deej Next: hardware volume mixer for Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "deej-next"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
deej-core = { path = "../../crates/deej-core" }
deej-audio = { path = "../../crates/deej-audio" }
deej-serial = { path = "../../crates/deej-serial" }
deej-platform = { path = "../../crates/deej-platform" }
notify = { version = "8.2", default-features = false }
tauri = { version = "2.12", features = ["image-png", "tray-icon"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-notification = "2.4.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com"] }

[dev-dependencies]
tempfile.workspace = true
